name: Validate corpus

# Every report package must contain report.md, metadata.yaml,
# provenance.yaml and acquisition.yaml, and be listed in the catalogue.

on:
  push:
    paths:
      - "archive/**"
      - "catalogue/**"
      - "scripts/**"
      - ".github/workflows/validate-corpus.yml"
  pull_request:
    paths:
      - "archive/**"
      - "catalogue/**"
      - "scripts/**"
      - ".github/workflows/validate-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check report packages are complete
        run: python scripts/validate_corpus.py

name: Check links

# Checks that recorded source URLs still resolve. Runs weekly and on demand
# rather than on every push, because external websites change independently
# of this repository. A failure is a prompt to record a UK Government Web
# Archive capture. It never means the preserved PDF should be replaced.

on:
  schedule:
    - cron: "23 5 * * 1" # 05:23 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check source URLs
        run: python scripts/check_links.py

# Planned reports: the archive's acquisition list
#
# Significant UK public library policy, strategy, standards, consultation and
# review documents from c. 1995 onwards, chosen for future preservation.
#
# IMPORTANT: entries here are WORKING DESCRIPTIONS, not catalogue records.
# Titles, years and publishers come from secondary knowledge of the sector and
# have not yet been checked against the publication itself. Anything not yet
# known is null. Do not cite these entries. At workflow stage 2 (source
# verification) the title page and imprint are authoritative, and
# metadata.yaml takes its values from them, not from this list.
#
# Fields:
#   id            proposed archive id (may change at ingestion)
#   title         working title
#   year          expected year of publication, or null if not yet confirmed
#   publisher     expected issuing body, or null if not yet confirmed
#   country       jurisdiction covered
#   category      grouping used in the repository specification
#   document_type expected genre (see docs/metadata-schema.md)
#   verified      true only once checked against the source (stage 2)
#   status        planned | in-progress | archived
#   archived_id   id in catalogue/reports.yaml once archived

